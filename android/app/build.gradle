plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.ytmusic.client"
    compileSdk 34
    ndkVersion "26.1.10909125"

    defaultConfig {
        applicationId "com.ytmusic.client"
        minSdk 24
        targetSdk 34
        versionCode flutter.versionCode
        versionName flutter.versionName
        multiDexEnabled true
    }

    signingConfigs {
        debug {
            if (keystoreProperties.containsKey('debug.storeFile')) {
                storeFile file(keystoreProperties['debug.storeFile'])
                storePassword keystoreProperties['debug.storePassword']
                keyAlias keystoreProperties['debug.keyAlias']
                keyPassword keystoreProperties['debug.keyPassword']
            } else {
                storeFile file('../app/debug.keystore')
                storePassword "android"
                keyAlias "debug"
                keyPassword "android"
            }
        }
        release {
            if (keystoreProperties.containsKey('release.storeFile')) {
                storeFile file(keystoreProperties['release.storeFile'])
                storePassword keystoreProperties['release.storePassword']
                keyAlias keystoreProperties['release.keyAlias']
                keyPassword keystoreProperties['release.keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable true
            minifyEnabled false
            shrinkResources false
            matchingFallbacks = ['release']
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        buildConfig = true
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1,LICENSE,NOTICE}'
        }
    }
}

flutter {
    source = '../..'
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.media3:media3-session:1.3.1'
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okio:okio:3.5.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'androidx.activity:activity-ktx:1.8.2'
}