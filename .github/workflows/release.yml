name: Build, Sign & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0 or v1.0.0-beta.1)'
        required: true
        type: string
      build_type:
        description: 'Build type'
        required: true
        type: choice
        options:
          - debug
          - release
          - both
        default: 'both'

permissions:
  contents: write
  packages: read
  id-token: write

env:
  JAVA_VERSION: '17'
  FLUTTER_VERSION: '3.24.0'
  FLUTTER_CHANNEL: 'stable'

jobs:
  prepare:
    name: Prepare & Validate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
      version_name: ${{ steps.extract_version.outputs.version_name }}
      version_code: ${{ steps.extract_version.outputs.version_code }}
      is_prerelease: ${{ steps.check_prerelease.outputs.is_prerelease }}
      channel: ${{ steps.check_prerelease.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version Info
        id: extract_version
        run: |
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.version }}}"
          # Remove 'v' prefix
          VERSION="${TAG#v}"
          # Extract version code from version name (e.g., 1.0.0 -> 10000)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$(echo "$VERSION" | sed 's/-.*//')"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
          echo "Version Code: $VERSION_CODE"

      - name: Determine Release Channel
        id: check_prerelease
        run: |
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.version }}}"
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          
          if [[ "$TAG" == *"-alpha"* ]] || [[ "$TAG" == *"-beta"* ]] || [[ "$TAG" == *"-rc"* ]] || [[ "$TAG" == *"-debug"* ]] || [[ "$BUILD_TYPE" == "debug" ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "channel=debug" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "channel=release" >> $GITHUB_OUTPUT
          fi
          echo "Channel: ${{ steps.check_prerelease.outputs.channel }}"
          echo "Prerelease: ${{ steps.check_prerelease.outputs.is_prerelease }}"

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      matrix:
        arch: [arm64-v8a, armeabi-v7a, x86_64]
        include:
          - arch: arm64-v8a
            flutter_target: arm64
          - arch: armeabi-v7a
            flutter_target: arm
          - arch: x86_64
            flutter_target: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}

      - name: Install Dependencies
        run: flutter pub get

      - name: Setup Debug Keystore
        if: needs.prepare.outputs.channel == 'debug' || needs.prepare.outputs.channel == 'both'
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: 'debug.keystore'
          encodedString: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          filePath: 'android/app/'

      - name: Setup Release Keystore
        if: needs.prepare.outputs.channel == 'release' || needs.prepare.outputs.channel == 'both'
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: 'release.keystore'
          encodedString: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          filePath: 'android/app/'

      - name: Configure Signing Properties
        run: |
          cat > android/keystore.properties << EOF
          debug.storeFile=../app/debug.keystore
          debug.storePassword=${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          debug.keyAlias=${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
          debug.keyPassword=${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
          
          release.storeFile=../app/release.keystore
          release.storePassword=${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          release.keyAlias=${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          release.keyPassword=${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          EOF
          cat android/keystore.properties

      - name: Update Version in pubspec.yaml
        run: |
          VERSION="${{ needs.prepare.outputs.version_name }}"
          VERSION_CODE="${{ needs.prepare.outputs.version_code }}"
          sed -i "s/^version: .*/version: $VERSION+$VERSION_CODE/" pubspec.yaml
          echo "Updated pubspec.yaml to version: $VERSION+$VERSION_CODE"
          cat pubspec.yaml | grep version

      - name: Build Debug APKs
        if: needs.prepare.outputs.channel == 'debug' || needs.prepare.outputs.channel == 'both'
        run: |
          flutter build apk --debug \
            --target-platform ${{ matrix.flutter_target }} \
            --split-per-abi \
            --build-name=${{ needs.prepare.outputs.version_name }} \
            --build-number=${{ needs.prepare.outputs.version_code }}

      - name: Build Release APKs
        if: needs.prepare.outputs.channel == 'release' || needs.prepare.outputs.channel == 'both'
        run: |
          flutter build apk --release \
            --target-platform ${{ matrix.flutter_target }} \
            --split-per-abi \
            --build-name=${{ needs.prepare.outputs.version_name }} \
            --build-number=${{ needs.prepare.outputs.version_code }}

      - name: Build Debug App Bundle (for Play Store)
        if: needs.prepare.outputs.channel == 'debug' || needs.prepare.outputs.channel == 'both'
        run: |
          flutter build appbundle --debug \
            --build-name=${{ needs.prepare.outputs.version_name }} \
            --build-number=${{ needs.prepare.outputs.version_code }}

      - name: Build Release App Bundle (for Play Store)
        if: needs.prepare.outputs.channel == 'release' || needs.prepare.outputs.channel == 'both'
        run: |
          flutter build appbundle --release \
            --build-name=${{ needs.prepare.outputs.version_name }} \
            --build-number=${{ needs.prepare.outputs.version_code }}

      - name: Rename & Organize Artifacts
        run: |
          VERSION="${{ needs.prepare.outputs.version_name }}"
          CHANNEL="${{ needs.prepare.outputs.channel }}"
          ARCH="${{ matrix.arch }}"
          
          mkdir -p artifacts
          
          # Debug APKs
          if [ "$CHANNEL" = "debug" ] || [ "$CHANNEL" = "both" ]; then
            for f in build/app/outputs/flutter-apk/app-${ARCH}-debug.apk; do
              if [ -f "$f" ]; then
                mv "$f" "artifacts/ytmusic-${VERSION}-${ARCH}-debug.apk"
                echo "Found debug APK: artifacts/ytmusic-${VERSION}-${ARCH}-debug.apk"
              fi
            done
            
            # Debug AAB
            if [ -f "build/app/outputs/bundle/debug/app-debug.aab" ]; then
              mv "build/app/outputs/bundle/debug/app-debug.aab" "artifacts/ytmusic-${VERSION}-debug.aab"
            fi
          fi
          
          # Release APKs
          if [ "$CHANNEL" = "release" ] || [ "$CHANNEL" = "both" ]; then
            for f in build/app/outputs/flutter-apk/app-${ARCH}-release.apk; do
              if [ -f "$f" ]; then
                mv "$f" "artifacts/ytmusic-${VERSION}-${ARCH}-release.apk"
                echo "Found release APK: artifacts/ytmusic-${VERSION}-${ARCH}-release.apk"
              fi
            done
            
            # Release AAB
            if [ -f "build/app/outputs/bundle/release/app-release.aab" ]; then
              mv "build/app/outputs/bundle/release/app-release.aab" "artifacts/ytmusic-${VERSION}-release.aab"
            fi
          fi
          
          ls -la artifacts/

      - name: Verify Signatures
        run: |
          for f in artifacts/*.apk; do
            if [ -f "$f" ]; then
              echo "Verifying: $f"
              jarsigner -verify -verbose -certs "$f" 2>&1 | head -20
              echo "---"
            fi
          done

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.arch }}-${{ needs.prepare.outputs.channel }}
          path: artifacts/
          retention-days: 30

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: prepare
    if: needs.prepare.outputs.channel == 'release' || needs.prepare.outputs.channel == 'both'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

        run: flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs

      - name: Update Version
        run: |
          VERSION="${{ needs.prepare.outputs.version_name }}"
          VERSION_CODE="${{ needs.prepare.outputs.version_code }}"
          sed -i "" "s/^version: .*/version: $VERSION+$VERSION_CODE/" pubspec.yaml

      - name: Setup iOS Certificates
        if: env.APP_STORE_CONNECT_API_KEY_ID != ''
        uses: apple-actions/download-provisioning-profiles@v1
        with:
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}

      - name: Build iOS (Release)
        run: |
          flutter build ipa --release \
            --build-name=${{ needs.prepare.outputs.version_name }} \
            --build-number=${{ needs.prepare.outputs.version_code }} \
            --export-options-plist=ios/ExportOptions.plist

      - name: Organize iOS Artifacts
        run: |
          VERSION="${{ needs.prepare.outputs.version_name }}"
          mkdir -p artifacts
          mv build/ios/ipa/*.ipa "artifacts/ytmusic-${VERSION}-ios.ipa" 2>/dev/null || true
          ls -la artifacts/

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ needs.prepare.outputs.version_name }}
          path: artifacts/
          retention-days: 30

  generate-changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.version }}}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -A1 "^${TAG}$" | tail -1)
          
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$TAG" ]; then
            PREV_TAG=$(git tag --sort=-v:refname | head -1)
          fi
          
          echo "Previous tag: $PREV_TAG"
          echo "Current tag: $TAG"
          
          if [ "$PREV_TAG" != "$TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%an)" ${PREV_TAG}..${TAG} --no-merges)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%an)" -10 --no-merges)
          fi
          
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, build-android, build-ios, generate-changelog]
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Organize Release Assets
        run: |
          ls -la all-artifacts/
          find all-artifacts -name "*.apk" -o -name "*.aab" -o -name "*.ipa" | head -20

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: YTMusic ${{ github.ref_name }}
          body: |
            ## YTMusic ${{ github.ref_name }}
            
            ### Channel: ${{ needs.prepare.outputs.channel }}
            
            ### Changelog
            ${{ needs.generate-changelog.outputs.changelog }}
            
            ### Downloads
            | Architecture | Debug APK | Release APK |
            |-------------|-----------|-------------|
            | arm64-v8a | `ytmusic-${{ needs.prepare.outputs.version }}-arm64-v8a-debug.apk` | `ytmusic-${{ needs.prepare.outputs.version }}-arm64-v8a-release.apk` |
            | armeabi-v7a | `ytmusic-${{ needs.prepare.outputs.version }}-armeabi-v7a-debug.apk` | `ytmusic-${{ needs.prepare.outputs.version }}-armeabi-v7a-release.apk` |
            | x86_64 | `ytmusic-${{ needs.prepare.outputs.version }}-x86_64-debug.apk` | `ytmusic-${{ needs.prepare.outputs.version }}-x86_64-release.apk` |
            | iOS (ARM64) | N/A | `ytmusic-${{ needs.prepare.outputs.version }}-ios.ipa` |
            
            ### Installation
            - **Android**: Download the APK matching your device architecture (usually arm64-v8a)
            - **iOS**: Install via TestFlight or sideload the .ipa
            
            ### Verification
            All artifacts are signed with the appropriate keystore:
            - Debug: Signed with debug keystore (consistent across builds)
            - Release: Signed with production release keystore
          draft: false
          prerelease: ${{ needs.prepare.outputs.is_prerelease }}
          files: |
            all-artifacts/*.apk
            all-artifacts/*.aab
            all-artifacts/*.ipa
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [create-release]
    if: always()
    steps:
      - name: Release Status
        run: |
          if [ "${{ needs.create-release.result }}" == "success" ]; then
            echo "✅ Release created successfully!"
            echo "🔗 https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
          else
            echo "❌ Release failed!"
            exit 1
          fi